<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiSmart Clientes</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <main class="app_shell">
      <header class="app_header">
        <img
          class="brand_logo"
          src="../public/images/logo.png"
          alt="Smart programas para empresas"
        />
      </header>

      <section class="settings_stack" aria-label="Configurações do aplicativo">
        <article class="card login_card">
          <h1 class="card_title">Login BISmart</h1>
          <div class="card_content">
            <div class="input_container">
              <label class="field_label" for="login_email_input">Email</label>
              <input id="login_email_input" class="text_input" type="email" />
            </div>
            <div class="input_container">
              <label class="field_label" for="login_password_input"
                >Senha</label
              >
              <input
                id="login_password_input"
                class="text_input"
                type="password"
              />
            </div>
            <button class="action_button" type="button">Salvar</button>
          </div>
        </article>

        <article class="card database_card">
          <h2 class="card_title">Bancos de dados</h2>
          <div class="card_content">
            <div class="database_summary">
              <div class="database_summary_header">
                <span class="database_name">Nome Banco</span>
                <button
                  class="icon_button"
                  type="button"
                  aria-label="Editar banco de dados"
                >
                  &#9998;
                </button>
              </div>
              <p><span class="summary_key">User:</span> root</p>
              <p><span class="summary_key">Banco de dados:</span> GERBD</p>
              <p><span class="summary_key">Sistema:</span> Acesse</p>
            </div>
          </div>
        </article>

        <article class="card tests_card">
          <h2 class="card_title">Ações</h2>
          <div class="card_content tests_content">
            <div class="test_item">
              <label class="field_label" for="server_test_input"
                >Testar conexão com o servidor</label
              >
              <output class="status_output" aria-live="polite"></output>
              <button class="action_button" type="button">Testar</button>
            </div>
            <div class="test_item">
              <label class="field_label" for="database_test_input"
                >Testar conexão com o banco de dados</label
              >
              <output class="status_output" aria-live="polite"></output>
              <button class="action_button" type="button">Testar</button>
            </div>
            <div class="test_item">
              <label class="field_label" for="send_data_test_input"
                >Forçar envio de dados</label
              >
              <div class="status_action_row">
                <input
                  id="force_send_date"
                  class="text_input date_input"
                  type="date"
                />
                -
                <input
                  id="force_send_date"
                  class="text_input date_input"
                  type="date"
                />
              </div>
              <output class="status_output" aria-live="polite"></output>
              <button class="action_button" type="button">Enviar</button>
            </div>
          </div>
        </article>

        <article class="card configuration_card">
          <h2 class="card_title">Configurações</h2>
          <div class="card_content configuration_list">
            <label class="checkbox_field"
              ><input type="checkbox" />
              <span>Enviar dados automaticamente para o servidor</span></label
            >
            <label class="checkbox_field"
              ><input type="checkbox" />
              <span>Enviar dados automaticamente para o servidor</span></label
            >
            <label class="checkbox_field"
              ><input type="checkbox" />
              <span>Enviar dados automaticamente para o servidor</span></label
            >
            <label class="checkbox_field"
              ><input type="checkbox" />
              <span>Enviar dados automaticamente para o servidor</span></label
            >
          </div>
        </article>
      </section>

      <section class="status_section" aria-labelledby="status_title">
        <h2 id="status_title" class="card_title">Status</h2>
        <div class="status_content">
          <output class="status_log" aria-live="polite"></output>
        </div>
      </section>
    </main>
  </body>
</html>
